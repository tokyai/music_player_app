name: music_player_app
description: 库仔音乐，一款支持 QQ音乐/网易云/酷狗搜索与播放的多平台音乐应用。
publish_to: 'none'
version: 2.9.17+2917

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  http: ^1.2.2
  dio: ^5.7.0
  crypto: ^3.0.6
  protobuf: ^6.0.0

  # 音频播放
  just_audio: ^0.9.39
  # 电视遥控器、车机方向盘和系统媒体会话共用应用内播放队列。
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  # MV 内置播放：Media3 ExoPlayer + libmpv 双内核
  video_player: ^2.11.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  # 系统媒体通知、锁屏和车机方向盘媒体键控制
  # Android 13+ 通知权限请求
  permission_handler: ^11.3.1
  speech_to_text: ^7.4.0
  # Android 车机离线流式识别：Zipformer CTC + 原始 PCM 麦克风输入。
  sherpa_onnx: 1.13.6
  record: 6.1.2
  flutter_secure_storage: ^11.0.0

  # 图片缓存
  cached_network_image: ^3.4.1

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.3.2

  # UI
  qr_flutter: ^4.1.0
  # 工具
  palette_generator: ^0.3.3+4

  package_info_plus: ^10.2.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pets/moomew/
    - assets/pets/xiaohei/
    - assets/pets/whale_girl/
    - assets/models/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01/
    - assets/models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8/
    - assets/models/sherpa-onnx-homophone-replacer-zh/
