name: music_player_app
description: 库仔音乐，一款支持 QQ音乐/网易云/酷狗搜索与播放的多平台音乐应用。
publish_to: 'none'
version: 2.3.0+2300

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  http: ^1.2.2
  dio: ^5.7.0
  crypto: ^3.0.6

  # 音频播放
  just_audio: ^0.9.39
  # 系统媒体通知/锁屏控制（播放时通知栏显示媒体胶囊）
  just_audio_background: ^0.0.1-beta.17
  # Android 13+ 通知权限请求
  permission_handler: ^11.3.1

  # 图片缓存
  cached_network_image: ^3.4.1

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.3.2

  # UI
  # 工具
  palette_generator: ^0.3.3+4

  package_info_plus: ^8.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
