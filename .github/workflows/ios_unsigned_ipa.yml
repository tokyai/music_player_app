name: iOS 未签名 IPA

# 手动触发，或推送 v* 标签时自动打包未签名 IPA。
# 产物为免签名 IPA（Payload/Runner.app），需自行用证书签名
# （如 Apple Developer 证书 + codesign、AltStore/Sideloadly/TrollStore 等）后才能安装到设备。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 打包未签名 IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Flutter 版本信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 运行测试
        run: flutter test

      - name: 构建 iOS Runner（免签名）
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION_LINE%%+*}"
          BUILD="${VERSION_LINE##*+}"
          IPA_NAME="kuzi-music-${VERSION}-${BUILD}-ios-unsigned"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          # -y 保留 Frameworks 内符号链接，避免 IPA 结构损坏
          cp -R Runner.app Payload/
          zip -qry "${IPA_NAME}.ipa" Payload
          mv "${IPA_NAME}.ipa" "$GITHUB_WORKSPACE/"
          ls -lh "${GITHUB_WORKSPACE}/${IPA_NAME}.ipa"

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa
          retention-days: 14
          if-no-files-found: error
