<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; media-src https: http: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark light">
  <title>库仔音乐</title>
  <link rel="stylesheet" href="app.css">
  <script src="ui.js" defer></script>
  <script src="player.js" defer></script>
  <script src="library.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="assistant.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="navigation">
      <div class="brand"><span class="brand-icon" aria-hidden="true">♫</span><span>库仔音乐<small>把喜欢的声音留在身边</small></span></div>
      <nav aria-label="主要导航">
        <button data-route="home"><span aria-hidden="true">◈</span><b>发现</b></button>
        <button data-route="search"><span aria-hidden="true">⌕</span><b>搜索</b></button>
        <button data-route="library"><span aria-hidden="true">♡</span><b>音乐库</b></button>
        <button data-route="settings"><span aria-hidden="true">⚙</span><b>设置</b></button>
      </nav>
      <button class="assistant-entry" data-route="assistant"><span aria-hidden="true">✦</span><b>音乐助理</b></button>
    </aside>
    <header class="topbar">
      <div><h1 id="page-title">发现</h1><p id="page-subtitle">音乐，让每一段路都有声音</p></div>
      <button id="user-button" class="user-button" aria-label="切换用户">用户</button>
    </header>
    <main id="content" tabindex="-1" aria-live="polite"></main>
    <footer class="mini-player" id="mini-player" aria-label="播放器">
      <button class="mini-song" id="open-player" aria-label="打开播放器">
        <span id="mini-cover" class="cover-placeholder">♫</span>
        <span><strong id="mini-title">选择一首喜欢的歌</strong><small id="mini-artist">支持 QQ、网易云和酷狗</small></span>
      </button>
      <div class="mini-controls">
        <button id="mini-favorite" class="icon-button" aria-label="收藏当前歌曲">♡</button>
        <button id="previous" class="icon-button" aria-label="上一首">⏮</button>
        <button id="play-pause" class="play-button" aria-label="播放或暂停">▶</button>
        <button id="next" class="icon-button" aria-label="下一首">⏭</button>
        <button id="open-queue" class="icon-button" aria-label="播放队列">☷</button>
      </div>
      <div class="mini-progress"><span id="position">0:00</span><input id="seek" type="range" min="0" max="1" value="0" aria-label="播放进度"><span id="duration">0:00</span></div>
    </footer>
  </div>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="modal-panel"><header><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="关闭">×</button></header><div id="modal-content"></div></section>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
