plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties["storeFile"]
        ? file(keystoreProperties["storeFile"])
        : null
def hasReleaseSigning = releaseStoreFile != null &&
        releaseStoreFile.exists() &&
        keystoreProperties["storePassword"] &&
        keystoreProperties["keyAlias"] &&
        keystoreProperties["keyPassword"]

android {
    namespace = "com.example.music_player_app"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.music_player_app"
        minSdkVersion = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = releaseStoreFile
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // flutter_secure_storage 11 catches Android Keystore Errors that
            // previously escaped its worker thread and terminated the app.
            minifyEnabled true
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // 禁用 JNI 原生构建（NDK 工具链不兼容 ARM64 主机）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// just_audio currently requests Media3 1.4.1 while video_player_android uses
// 1.9.2. Keep every Media3 module on one explicit runtime version so a future
// plugin update cannot silently introduce a different mixed graph.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "androidx.media3") {
            details.useVersion("1.9.2")
            details.because("Align just_audio and video_player Media3 modules")
        }
    }
}

// 跳过 JNI CMake 构建
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments '-DANDROID_STL=c++_shared'
                        }
                    }
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException(
                "Release signing is not configured. Copy android/key.properties.example " +
                "to android/key.properties and provide a persistent release keystore."
        )
    }
}
